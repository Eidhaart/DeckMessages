[package]
name = "deckmessages"
version = "0.1.0"
description = "Cyberpunk terminal client for Messenger (via Matrix bridge)"
edition = "2021"

[lib]
name = "deckmessages_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
